# ------------------------------------
# Configuration par défaut (optionnelle)
# ------------------------------------
spring:
  application:
    name: maquette-service

---

# ------------------------------------
# Profil Docker (default)
# ------------------------------------
spring:
  config:
    activate:
      on-profile: docker

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://api-user:8091/api/user/gestionCandidature/oauth/jwks

  datasource:
    url: jdbc:mariadb://mariadb-api-gestion-maquette:3306/gestionMaquette?createDatabaseIfNotExist=true&useSSL=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: root
    password: startup
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://ms-register:8093/eureka/

---

# ------------------------------------
# Profil Local
# ------------------------------------
spring:
  config:
    activate:
      on-profile: local

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8091/api/user/gestionCandidature/oauth/jwks

  datasource:
    url: jdbc:mariadb://localhost:3306/gestionMaquette?createDatabaseIfNotExist=true&useSSL=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: root
    password: startup
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8093/eureka/
