spring:
  application:
    name: maquette-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://api-user:8091/api/user/gestionCandidature/oauth/jwks  # URL pour obtenir les clés JWK

  datasource:
    url: jdbc:mariadb://mariadb-api-gestion-maquette:3306/gestionMaquette?createDatabaseIfNotExist=true&userSSL=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: root
    password: startup
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update  
      # ddl-auto: create-drop  
    show-sql: true


server:
  port: 8094

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://ms-register:8093/eureka/}
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    com.nimbusds: DEBUG
    org.springframework.security.oauth2.jwt: DEBUG

